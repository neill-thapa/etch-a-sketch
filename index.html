<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Etch-a-Sketch</title>
</head>
<body>
    <div id="parent-container">

        <h1>Etch-A-Sketch</h1>

        <div id="grid-and-controls">

            <div id="controls">

                <div id="buttons">
                    <button id="start">Start Drawing</button>
                    <button id="erase">Eraser</button>
                    <button id="reset">Reset</button>
                </div>
                
                <div id="grid-input">

                    <div id="input-section">
                        <label for="grid-size">Enter the grid size:</label>
                        <input id="grid-size" placeholder="For eg. 12 for 12×12 grid">
                        <p id="error-message"></p>
                    </div>

                    <button id="sizeGrid">Generate the grid</button>

                </div>

            </div>

            <div id="container"></div>

        </div>

    </div>

    <script src="./script.js"></script>
</body>
</html>
